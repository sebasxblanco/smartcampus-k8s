# Arranque: docker compose up --build -d
# Lee las variables del fichero .env (copia de .env.example con valores reales).

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Desde PostgreSQL 18 los datos se montan en /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      # Solo se ejecuta con el volumen vacío: crea las tablas y carga datos de ejemplo.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: smartcampus-backend:latest
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      # Puerto del host configurable: por defecto 8000 (ver el problema 7.3 de la memoria).
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - backend-net
      - frontend-net
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: smartcampus-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# Dos redes: el frontend no puede llegar a la base de datos, solo al backend.
networks:
  frontend-net:
  backend-net:

volumes:
  db-data:
