apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartcampus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Espera a que PostgreSQL acepte conexiones antes de arrancar la API
      # (la API crea las tablas al arrancar y fallaría sin base de datos).
      initContainers:
        - name: esperar-database
          image: postgres:18
          command: ["sh", "-c", "until pg_isready -h database-service -p 5432; do sleep 2; done"]
      containers:
        - name: backend
          image: smartcampus-backend:latest
          # La imagen se construye dentro de Minikube: no se descarga de ningún registro.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: smartcampus-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
