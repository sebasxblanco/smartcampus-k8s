# NodePort: expone el frontend fuera del clúster en <IP del nodo>:30080.
# En Minikube: minikube service frontend-service -n smartcampus
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smartcampus
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
