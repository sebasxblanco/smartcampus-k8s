# Credenciales de la base de datos.
#
# OJO: esto es una credencial de laboratorio para Minikube, no de producción.
# Un Secret solo codifica en base64 (no cifra): cualquiera con acceso al YAML o
# permiso de lectura sobre Secrets en el clúster la puede leer. En un entorno real
# no se versiona: se crea con "kubectl create secret" desde un gestor de secretos
# (Vault, AWS Secrets Manager...) o se cifra (Sealed Secrets, SOPS). Ver MEMORIA.md.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: smartcampus
type: Opaque
stringData:
  DB_USER: smartcampus
  DB_PASSWORD: solo-para-minikube
